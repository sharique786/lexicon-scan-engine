# Lexicon Scan Engine — test configuration (requirement 4.e: Spark
# configuration available in an application "test" properties file for
# JUnit/integration test use, without needing live Dataproc submit
# arguments). GCS buckets and BQ table/view identifiers are no longer
# Spring-bound config — they come from a DataprocConfig YAML file per run
# (see RuntimeArgsTest/BqTableConfigTest for equivalent test fixtures built
# directly in Java instead of via this properties file).
scan-engine:
  max-cached-databases-per-partition: 5
  created-by: lexicon-scan-engine-test
  stage-name: lexicon-scan-engine-test

spring:
  main:
    web-application-type: none
