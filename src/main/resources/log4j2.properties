# Log4j2 config for the Lexicon Scan Engine — DRIVER *and* EXECUTOR JVMs alike.
#
# Why this file exists: this project ships NO log4j2.properties/xml of its own
# today, so Log4j2 falls back to Spark's OWN bundled default
# (org/apache/spark/log4j2-defaults.properties, root level INFO) on every run —
# printing "Using Spark's default log4j profile" and then INFO-level lines for
# essentially every DAGScheduler stage, every TaskSetManager task, every
# Executor/BlockManager event, and a "Code generated in N ms" line per Catalyst
# codegen call. On a real multi-executor Dataproc cluster this is a LOT of
# volume (confirmed directly: exercising this job's own Spark integration
# tests, e.g. PipelineRecordAuditIntegrationTest/SparkSessionConfigTest,
# without this file produces exactly this flood). Shipping our own config here
# is the standard, portable way to control it — Log4j2's ConfigurationFactory
# prefers a log4j2.properties found on the classpath over Spark's bundled
# fallback, and since this file lives in src/main/resources it is packaged
# into the SAME shaded jar Spark ships to every executor — unlike Spring
# Boot's own `logging.level.*` (application.yml), which only ever reaches the
# DRIVER (see LexiconScanEngineApplication class Javadoc, "Spring's reach ends
# at the driver" — executors run PartitionProcessor closures directly, with no
# Spring ApplicationContext and therefore no Spring Boot LoggingSystem, at
# all). That YAML block has been removed in favour of this file being the
# single source of truth for BOTH JVM roles.
#
# root=warn keeps genuine problems (WARN/ERROR from Spark, Hadoop, the GCS/
# BigQuery connectors, Hyperscan, everything) fully visible; this job's own
# package is raised back to INFO since its own stage-timing/progress/
# per-message-failure logs (see ScanEngineJobRunner#runStage,
# PartitionProcessor) are the actually useful operational signal on Dataproc,
# not noise.

status = error
name = LexiconScanEngineLog4j2Config

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

# This job's own code — the operational signal worth keeping at INFO.
logger.spectre.name = com.db.macs3.ecomms.spectre
logger.spectre.level = info

# Named explicitly (redundant with rootLogger.level=warn today, but
# self-documenting and future-proof against someone raising root to INFO for
# local debugging without meaning to re-enable all of Spark's own chatter too).
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn

# The BigQuery connector and the gRPC/HTTP client libraries it and the GCS
# client pull in are both independently very chatty at INFO (connection pool
# churn, per-request tracing).
logger.bigquery.name = com.google.cloud.spark.bigquery
logger.bigquery.level = warn

logger.grpc.name = io.grpc
logger.grpc.level = warn

logger.google-http.name = com.google.api.client.http
logger.google-http.level = warn
