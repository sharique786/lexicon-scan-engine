# Lexicon Scan Engine — production configuration.
#
# GCS buckets and BQ table/view identifiers are NOT configured here — they
# are per-pipeline-execution values, supplied via the --config_file_path
# Dataproc submit argument (a DataprocConfig YAML file on GCS; see
# RuntimeArgs/DataprocConfig class Javadoc). What remains here is genuine
# job-infrastructure config, overridable at Dataproc submit time as Spark
# driver system properties (e.g.
# --properties spark.driver.extraJavaOptions=-Dscan-engine.stage-name=...)
# via Spring Boot's standard property-source precedence.
scan-engine:
  max-cached-databases-per-partition: 20
  created-by: SPECTRE-COMPOSER-SA
  stage-name: spectre-lexicon-tagging

# Logging levels are NOT configured here — see src/main/resources/log4j2.properties
# instead. A Spring Boot `logging.level.*` block only ever reaches the DRIVER
# (Spring Boot's LoggingSystem never runs on an executor — see
# LexiconScanEngineApplication class Javadoc, "Spring's reach ends at the
# driver"), so it cannot be what actually controls Spark's own log volume,
# most of which is generated by executors. log4j2.properties, being a plain
# classpath resource inside the same shaded jar Spark ships to every
# executor, is the one config both driver and executor JVMs actually see.
